name: BSE announcements

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run BSE alert
        run: java -jar bse-alert.jar
        env:
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}

      - name: Save sent-alert history
        run: |
          git config user.name "bse-alert-bot"
          git config user.email "bse-alert-bot@users.noreply.github.com"
          git add .bse-alert-state.properties
          git diff --cached --quiet || git commit -m "Update sent-alert history"
          git push
