name: BSE announcements

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Run BSE alert
        run: java -jar bse-alert.jar
        env:
            BSE_FROM_EMAIL: ${{ secrets.BSE_FROM_EMAIL }}
            BSE_GMAIL_APP_PASSWORD: ${{ secrets.BSE_GMAIL_APP_PASSWORD }}
            BSE_TO_EMAIL: ${{ secrets.BSE_TO_EMAIL }}


      - name: Save sent-alert history
        run: |
          git config user.name "bse-alert-bot"
          git config user.email "bse-alert-bot@users.noreply.github.com"
          git add .bse-alert-state.properties
          git diff --cached --quiet || git commit -m "Update sent-alert history"
          git push
